<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree v0.12</title> 
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .toolbar {
            background-color: #4a6fa5;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .toolbar-title {
            font-weight: bold;
            margin-right: 10px;
        }
        
        .toolbar-buttons {
            display: flex;
            gap: 8px;
        }
        
        .toolbar-button {
            background-color: #3a5a8f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .toolbar-button:hover {
            background-color: #2d4a7f;
        }
        
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .status-bar {
            background-color: #333;
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
        }
        
        .status-icon {
            margin-right: 5px;
            font-size: 12px;
        }
        
        @media (max-width: 600px) {
            .toolbar {
                padding: 8px;
            }
            
            .toolbar-title {
                font-size: 14px;
            }
            
            .toolbar-button {
                padding: 4px 8px;
                font-size: 12px;
            }
            
            .status-bar {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">画布应用 v0.12</span>
        <div class="toolbar-buttons">
            <button class="toolbar-button" id="refreshBtn">刷新</button>
            <button class="toolbar-button" id="settingsBtn">设置</button>
            <button class="toolbar-button" id="helpBtn">帮助</button>
        </div>
    </div>
    
    <div class="canvas-container">
        <canvas id="treeCanvas"></canvas>
    </div>
    
    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⏳</span>
            <span id="loadStatus">页面已加载</span>
        </div>
        <div class="status-item">
            <span class="status-icon">🕒</span>
            <span id="currentTime"></span>
        </div>
    </div>

    <script>
        // 更新当前时间
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('currentTime').textContent = timeString;
        }
        
        // 初始化时间显示并每秒秒更新
        updateTime();
        setInterval(updateTime, 1000);
        
        class CTree {
            /**
             * 构造函数
             * @param {string} canvasId - 画布元素ID
             */
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.container = this.canvas.parentElement;
                this.treeCount = 1; // 默认树木数量
                this.leafColors = ['#81C784', '#66BB6A', '#4CAF50', '#388E3C'];
                this.trunkColor = '#5D4037';
                this.skyGradient = null;
                this.groundColor = '#8BC34A';
                
                this._init();
            }
            
            /**
             * 初始化函数
             */
            _init() {
                this._setupEventListeners();
                this._resizeCanvas();
                this.render();
            }
            
            /**
             * 设置事件监听器
             */
            _setupEventListeners() {
                window.addEventListener('resize', () => this._resizeCanvas());
            }
            
            /**
             * 调整画布大小
             */
            _resizeCanvas() {
                this.canvas.width = this.container.clientWidth;
                this.canvas.height = this.container.clientHeight;
                this._createSkyGradient();
                this.render();
            }
            
            /**
             * 创建天空渐变
             */
            _createSkyGradient() {
                const groundLevel = this.canvas.height * 0.8;
                this.skyGradient = this.ctx.createLinearGradient(0, 0, 0, groundLevel);
                this.skyGradient.addColorStop(0, '#87CEEB');
                this.skyGradient.addColorStop(1, '#E0F7FA');
            }
            
            /**
             * 绘制背景
             */
            _drawBackground() {
                const width = this.canvas.width;
                const height = this.canvas.height;
                const groundLevel = height * 0.8;
                
                // 绘制天空
                this.ctx.fillStyle = this.skyGradient;
                this.ctx.fillRect(0, 0, width, groundLevel);
                
                // 绘制地面
                this.ctx.fillStyle = this.groundColor;
                this.ctx.fillRect(0, groundLevel, width, height - groundLevel);
            }
            
            /**
             * 绘制树干
             * @param {number} x - 树干底部中心点X坐标
             * @param {number} y - 树干底部中心点Y坐标
             * @param {number} height - 树干高度
             */
            _drawTrunk(x, y, height = 150) {
                this.ctx.fillStyle = this.trunkColor;
                this.ctx.beginPath();
                this.ctx.moveTo(x - 15, y);
                this.ctx.lineTo(x + 15, y);
                this.ctx.lineTo(x + 10, y - height);
                this.ctx.lineTo(x - 10, y - height);
                this.ctx.closePath();
                this.ctx.fill();
            }
            
            /**
             * 绘制树叶簇
             * @param {number} x - 树叶簇中心点X坐标
             * @param {number} y - 树叶簇中心点Y坐标
             * @param {number} width - 树叶簇宽度
             * @param {number} height - 树叶簇高度
             * @param {number} density - 树叶密度
             */
            _drawLeafCluster(x, y, width, height, density) {
                for (let i = 0; i < density; i++) {
                    const leafX = x + (Math.random() - 0.5) * width;
                    const leafY = y + (Math.random() - 0.5) * height;
                    const leafSize = 5 + Math.random() * 15;
                    const leafColor = this.leafColors[Math.floor(Math.random() * this.leafColors.length)];
                    
                    this.ctx.fillStyle = leafColor;
                    this.ctx.beginPath();
                    this.ctx.arc(leafX, leafY, leafSize, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }
            
            /**
             * 绘制单棵树
             * @param {number} x - 树干底部中心点X坐标
             * @param {number} y - 树干底部中心点Y坐标
             */
            _drawSingleTree(x, y) {
                // 绘制树干
                this._drawTrunk(x, y);
                
                // 绘制树冠
                this._drawLeafCluster(x, y - 180, 100, 120, 50);
                this._drawLeafCluster(x - 40, y - 150, 60, 80, 30);
                this._drawLeafCluster(x + 40, y - 150, 60, 80, 30);
            }
            
            /**
             * 绘制多棵树
             */
            _drawMultipleTrees() {
                const width = this.canvas.width;
                const height = this.canvas.height;
                const groundLevel = height * 0.8;
                
                // 根据画布宽度计算树木间距
                const treeSpacing = width / (this.treeCount + 1);
                
                for (let i = 1; i <= this.treeCount; i++) {
                    const treeX = treeSpacing * i;
                    // 随机调整树木高度，创建层次感
                    const treeHeight = 120 + Math.random() * 80;
                    const treeY = groundLevel - (Math.random() * 50);
                    
                    this._drawTrunk(treeX, treeY, treeHeight);
                    
                    // 根据树干高度调整树冠大小
                    const mainClusterSize = 80 + (treeHeight / 150) * 40;
                    const subClusterSize = 50 + (treeHeight / 150) * 30;
                    
                    this._drawLeafCluster(treeX, treeY - treeHeight - 30, mainClusterSize, mainClusterSize * 1.2, 40 + Math.random() * 20);
                    this._drawLeafCluster(treeX - mainClusterSize * 0.4, treeY - treeHeight, subClusterSize, subClusterSize * 1.3, 20 + Math.random() * 20);
                    this._drawLeafCluster(treeX + mainClusterSize * 0.4, treeY - treeHeight, subClusterSize, subClusterSize * 1.3, 20 + Math.random() * 20);
                }
            }
            
            /**
             * 设置树木数量
             * @param {number} count - 树木数量
             */
            setTreeCount(count) {
                if (count > 0 && count <= 10) { // 限制树木数量在1-10之间
                    this.treeCount = count;
                    this.render();
                }
            }
            
            /**
             * 设置树叶颜色
             * @param {array} colors - 树叶颜色数组
             */
            setLeafColors(colors) {
                if (Array.isArray(colors) && colors.length > 0) {
                    this.leafColors = colors;
                    this.render();
                }
            }
            
            /**
             * 设置树干颜色
             * @param {string} color - 树干颜色
             */
            setTrunkColor(color) {
                this.trunkColor = color;
                this.render();
            }
            
            /**
             * 设置地面颜色
             * @param {string} color - 地面颜色
             */
            setGroundColor(color) {
                this.groundColor = color;
                this.render();
            }
            
            /**
             * 渲染树木
             */
            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this._drawBackground();
                
                if (this.treeCount === 1) {
                    // 单棵树居中显示
                    this._drawSingleTree(this.canvas.width / 2, this.canvas.height * 0.8);
                } else {
                    // 多棵树分布显示
                    this._drawMultipleTrees();
                }
            }
}
       
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', function() {
            // 创建CTree实例
            const treeCanvas = new CTree('treeCanvas');
            
            // 添加按钮事件
            document.getElementById('refreshBtn').addEventListener('click', function() {
                document.getElementById('loadStatus').textContent = '刷新中...';
                setTimeout(() => {
                    treeCanvas.render();
                    document.getElementById('loadStatus').textContent = '已刷新';
                }, 500);
            });
            
            document.getElementById('settingsBtn').addEventListener('click', function() {
                // 示例：随机调整树木数量（1-5棵）
                const randomTreeCount = Math.floor(Math.random() * 5) + 1;
                treeCanvas.setTreeCount(randomTreeCount);
                document.getElementById('loadStatus').textContent = `已设置${randomTreeCount}棵树`;
            });
            
            document.getElementById('helpBtn').addEventListener('click', function() {
                alert('画布应用 v0.11\n\n这是一个展示树木的响应式画布页面。\n- 刷新按钮：重新绘制树木\n- 设置按钮：随机调整树木数量\n- 帮助按钮：显示本帮助信息');
            });
            
            // 初始状态更新
            document.getElementById('loadStatus').textContent = 'CTree类已初始化';
        });
    </script>
</body>
</html>
