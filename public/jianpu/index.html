<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式画布网页 v0.12</title>
    <script src="class/cTree.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .toolbar {
            background-color: #4a6fa5;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .toolbar-title {
            font-weight: bold;
            margin-right: 10px;
        }
        
        .toolbar-buttons {
            display: flex;
            gap: 8px;
        }
        
        .toolbar-button {
            background-color: #3a5a8f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .toolbar-button:hover {
            background-color: #2d4a7f;
        }
        
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .status-bar {
            background-color: #333;
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
        }
        
        .status-icon {
            margin-right: 5px;
            font-size: 12px;
        }
        
        @media (max-width: 600px) {
            .toolbar {
                padding: 8px;
            }
            
            .toolbar-title {
                font-size: 14px;
            }
            
            .toolbar-button {
                padding: 4px 8px;
                font-size: 12px;
            }
            
            .status-bar {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">画布应用 v0.12</span>
        <div class="toolbar-buttons">
            <button class="toolbar-button" id="refreshBtn">刷新</button>
            <button class="toolbar-button" id="settingsBtn">设置</button>
            <button class="toolbar-button" id="helpBtn">帮助</button>
        </div>
    </div>
    
    <div class="canvas-container">
        <canvas id="treeCanvas"></canvas>
    </div>
    
    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⏳</span>
            <span id="loadStatus">页面已加载</span>
        </div>
        <div class="status-item">
            <span class="status-icon">🕒</span>
            <span id="currentTime"></span>
        </div>
    </div>

    <script>
        // 更新当前时间
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('currentTime').textContent = timeString;
        }
        
        // 初始化时间显示并每秒秒更新
        updateTime();
        setInterval(updateTime, 1000);
        
       
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', function() {
            // 创建CTree实例
            const treeCanvas = new CTree('treeCanvas');
            
            // 添加按钮事件
            document.getElementById('refreshBtn').addEventListener('click', function() {
                document.getElementById('loadStatus').textContent = '刷新中...';
                setTimeout(() => {
                    treeCanvas.render();
                    document.getElementById('loadStatus').textContent = '已刷新';
                }, 500);
            });
            
            document.getElementById('settingsBtn').addEventListener('click', function() {
                // 示例：随机调整树木数量（1-5棵）
                const randomTreeCount = Math.floor(Math.random() * 5) + 1;
                treeCanvas.setTreeCount(randomTreeCount);
                document.getElementById('loadStatus').textContent = `已设置${randomTreeCount}棵树`;
            });
            
            document.getElementById('helpBtn').addEventListener('click', function() {
                alert('画布应用 v0.11\n\n这是一个展示树木的响应式画布页面。\n- 刷新按钮：重新绘制树木\n- 设置按钮：随机调整树木数量\n- 帮助按钮：显示本帮助信息');
            });
            
            // 初始状态更新
            document.getElementById('loadStatus').textContent = 'CTree类已初始化';
        });
    </script>
</body>
</html>
